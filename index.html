<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140e0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hollowmere Dispatch" />
    <meta
      name="description"
      content="Hollowmere Dispatch — a ghostly point-and-click. Case 0: The Bellweather Bookshop."
    />
    <title>Hollowmere Dispatch</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="rotate" aria-hidden="true">
      <div class="phone" aria-hidden="true">
        <svg viewBox="0 0 86 132" width="86" height="132">
          <rect x="6" y="4" width="74" height="124" rx="14" fill="#2a1c12" stroke="#c6a15a" stroke-width="4" />
          <rect x="14" y="18" width="58" height="90" rx="4" fill="#1a2838" />
          <rect x="18" y="28" width="22" height="28" rx="2" fill="#d4b36a" opacity="0.85" />
          <circle cx="43" cy="104" r="5" fill="#140e0a" stroke="#c6a15a" stroke-width="2" />
        </svg>
      </div>
      <p>Turn your phone sideways</p>
      <span>The case is wider than it is tall.</span>
    </div>
    <div id="ios-tip" aria-hidden="true">
      <p>For full screen: tap Share, then Add to Home Screen.</p>
      <button type="button" id="ios-tip-dismiss">Got it</button>
    </div>
    <div id="game">
      <p id="loading">Lighting the lamps…</p>
    </div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
