<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b14" />
    <meta
      name="description"
      content="Hollowmere Dispatch — a ghost-themed mystery clicker. Case 0: The Bellweather Bookshop."
    />
    <title>Hollowmere Dispatch</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="rotate" aria-hidden="true">
      <p>Turn your phone sideways</p>
      <span>The shop is wider than it is tall.</span>
    </div>
    <div id="game">
      <p id="loading">Lighting the lamps…</p>
    </div>
    <div id="nameplate" hidden>
      <label for="detective-name">Name on the door</label>
      <input
        id="detective-name"
        name="detective-name"
        maxlength="16"
        autocomplete="off"
        autocapitalize="words"
        enterkeyhint="done"
        placeholder="e.g. Rowan Hale"
      />
      <button type="button" id="name-confirm">Engrave</button>
      <p id="name-error"></p>
    </div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <div id="debug-step" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
